<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Saturnus Ultimate - One File</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: #0ff; font-family: 'Courier New', monospace; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; border-left: 3px solid #0ff; padding-left: 15px; pointer-events: none; }
        #video-container { position: absolute; bottom: 20px; right: 20px; width: 180px; transform: scaleX(-1); border: 1px solid #333; border-radius: 10px; overflow: hidden; }
        .info { font-size: 11px; color: #888; margin-top: 5px; }
    </style>
</head>
<body>
    <div id="ui">
        <h2 id="status">MENCARI TANGAN...</h2>
        <div class="info">
            • Telunjuk: SUPERNOVA<br>
            • Tengah: EIFFEL TOWER<br>
            • Manis: ROCKET MODE<br>
            • Jempol-Kelingking: ZOOM
        </div>
    </div>
    <video id="input_video" style="display:none"></video>
    <div id="video-container"><canvas id="output_canvas" style="width:100%"></canvas></div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const group = new THREE.Group();
        scene.add(group);

        const COUNT = 15000;
        const geo = new THREE.BufferGeometry();
        const positions = new Float32Array(COUNT * 3);
        const targetPos = new Float32Array(COUNT * 3);
        const colors = new Float32Array(COUNT * 3);

        // --- BENTUK DEFAULT: SATURNUS ---
        for (let i = 0; i < COUNT; i++) {
            let x, y, z;
            if (i < 7000) { // Planet
                const r = 4 * Math.pow(Math.random(), 0.5);
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                x = r * Math.sin(phi) * Math.cos(theta);
                y = r * Math.sin(phi) * Math.sin(theta);
                z = r * Math.cos(phi);
            } else { // Cincin
                const a = Math.random() * Math.PI * 2;
                const r = 6.5 + Math.random() * 3.5;
                x = Math.cos(a) * r;
                y = (Math.random() - 0.5) * 0.2;
                z = Math.sin(a) * r;
            }
            targetPos[i*3] = x; targetPos[i*3+1] = y; targetPos[i*3+2] = z;
            positions[i*3] = x; positions[i*3+1] = y; positions[i*3+2] = z;
            
            const col = new THREE.Color(i < 7000 ? 0xffaa00 : 0x00ffff);
            colors[i*3] = col.r; colors[i*3+1] = col.g; colors[i*3+2] = col.b;
        }

        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        const mat = new THREE.PointsMaterial({ size: 0.06, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true });
        const points = new THREE.Points(geo, mat);
        group.add(points);

        camera.position.z = 25;

        // --- STATE & INTERAKSI ---
        let mode = "SATURN";
        let targetZ = 25;
        const statusEl = document.getElementById('status');

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.75 });

        hands.onResults(res => {
            if (res.multiHandLandmarks && res.multiHandLandmarks[0]) {
                const lm = res.multiHandLandmarks[0];
                
                // ZOOM (Jempol ke Kelingking)
                const d = Math.hypot(lm[4].x - lm[20].x, lm[4].y - lm[20].y);
                targetZ = 45 - (d * 50);

                // CEK JARI (Tegak = y Tip < y PIP)
                const telunjuk = lm[8].y < lm[6].y;
                const tengah = lm[12].y < lm[10].y;
                const manis = lm[16].y < lm[14].y;

                if (telunjuk && !tengah) {
                    mode = "SUPERNOVA";
                    statusEl.innerText = "MODE: SUPERNOVA";
                    statusEl.style.color = "#ff4444";
                } else if (tengah && !manis) {
                    mode = "EIFFEL";
                    statusEl.innerText = "MODE: EIFFEL TOWER";
                    statusEl.style.color = "#ffffff";
                } else if (manis) {
                    mode = "ROCKET";
                    statusEl.innerText = "MODE: ROCKET";
                    statusEl.style.color = "#00ff00";
                } else {
                    mode = "SATURN";
                    statusEl.innerText = "MODE: SATURNUS";
                    statusEl.style.color = "#00ffff";
                }
            } else {
                mode = "SATURN";
                statusEl.innerText = "MENCARI TANGAN...";
            }
        });

        const cam = new Camera(document.getElementById('input_video'), {
            onFrame: async () => { await hands.send({image: document.getElementById('input_video')}); },
            width: 640, height: 480
        });
        cam.start();

        // --- ANIMATION ENGINE ---
        function animate() {
            requestAnimationFrame(animate);
            const p = geo.attributes.position.array;
            
            for (let i = 0; i < COUNT; i++) {
                let tx = targetPos[i*3], ty = targetPos[i*3+1], tz = targetPos[i*3+2];

                if (mode === "SUPERNOVA") {
                    p[i*3] += (Math.random() - 0.5) * 1.8;
                    p[i*3+1] += (Math.random() - 0.5) * 1.8;
                    p[i*3+2] += (Math.random() - 0.5) * 1.8;
                } else if (mode === "EIFFEL") {
                    // Algoritma Menara Eiffel (A-Frame)
                    const h = (i / COUNT) * 16; 
                    const taper = Math.pow(1 - (h / 16), 2) * 5;
                    tx = (Math.random() - 0.5) * taper;
                    ty = h - 8;
                    tz = (Math.random() - 0.5) * taper;
                    p[i*3] += (tx - p[i*3]) * 0.1;
                    p[i*3+1] += (ty - p[i*3+1]) * 0.1;
                    p[i*3+2] += (tz - p[i*3+2]) * 0.1;
                } else if (mode === "ROCKET") {
                    // Algoritma Roket (Silinder + Cone)
                    const h = (i / COUNT) * 14;
                    let r = 1.5;
                    if (h > 10) r = 1.5 * (1 - (h-10)/4); // Hidung roket
                    const ang = Math.random() * Math.PI * 2;
                    tx = Math.cos(ang) * r;
                    ty = h - 7;
                    tz = Math.sin(ang) * r;
                    // Sirip
                    if (h < 3 && i % 10 === 0) { tx *= 3; tz *= 3; }
                    p[i*3] += (tx - p[i*3]) * 0.1;
                    p[i*3+1] += (ty - p[i*3+1]) * 0.1;
                    p[i*3+2] += (tz - p[i*3+2]) * 0.1;
                } else {
                    // Kembali ke Saturnus
                    p[i*3] += (tx - p[i*3]) * 0.08;
                    p[i*3+1] += (ty - p[i*3+1]) * 0.08;
                    p[i*3+2] += (tz - p[i*3+2]) * 0.08;
                }
            }

            geo.attributes.position.needsUpdate = true;
            camera.position.z += (targetZ - camera.position.z) * 0.1;
            group.rotation.y += 0.005;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
